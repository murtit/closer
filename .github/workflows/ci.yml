name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write        # push screenshots to the ci-screenshots branch
      pull-requests: write   # post the screenshot comment
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,ds in sorted(d.items(), reverse=True) if "iOS" in r for x in ds if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator with a clean status bar
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          xcrun simctl status_bar "${{ steps.sim.outputs.udid }}" override \
            --time 9:41 --dataNetwork wifi --wifiBars 3 --cellularBars 4 \
            --batteryState charged --batteryLevel 100

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Closer.xcodeproj \
            -scheme Closer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export screenshots
        if: ${{ !cancelled() }}
        run: python3 scripts/export-screenshots.py build/TestResults.xcresult build/Screenshots

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: build/Screenshots/*.png
          if-no-files-found: ignore

      # Forks get a read-only token, so only PRs from branches of this repository are commented.
      - name: Post screenshots on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/publish-screenshots.sh build/Screenshots

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
